<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cf1530">
  <meta name="robots" content="noindex">
  <title>Dealer Lead Management System Survey | Mahindra South Africa</title>
  <meta property="og:title" content="Dealer Lead Management System Survey">
  <meta property="og:description" content="Mahindra South Africa · 7 short questions · 2–3 minutes">
  <link rel="icon" type="image/png" href="assets/mahindra-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2026.11.06-2">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <img class="topbar__logo" src="assets/mahindra-logo.png" alt="Mahindra">
    </div>
  </header>

  <main class="shell">
    <form class="card" id="survey" novalidate>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>
        <p class="progress__label" id="progressLabel" aria-live="polite"></p>
      </div>

      <!-- Screens are rendered by app.js -->
      <section class="screen" id="screen" tabindex="-1"></section>

      <p class="error" id="errorMsg" role="alert"></p>
      <nav class="actions">
        <button type="button" class="btn btn--ghost" id="backBtn">Back</button>
        <button type="submit" class="btn btn--primary" id="nextBtn">Start Survey</button>
      </nav>
      <p class="fineprint" id="finePrint"></p>
    </form>

    <footer class="foot">© <span id="year">2026</span> Mahindra South Africa. All rights reserved.</footer>
  </main>

  <script src="config.js?v=2026.11.06-2"></script>
  <script src="app.js?v=2026.11.06-2"></script>
</body>
</html>
